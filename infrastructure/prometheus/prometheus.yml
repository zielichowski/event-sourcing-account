global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  - job_name: 'prometheus'
    static_configs:
      - targets: ['127.0.0.1:9090']

  - job_name: 'java-services'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 5s
    static_configs:
      - targets: ['app:8080']
        labels:
          application: event-sourcing-account
      - targets: ['application:8081']
        labels:
          application: loyalty-service

  - job_name: 'kafka-brokers'
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets: ['broker1:9404']           # ← Use 9404, not 9401
        labels:
          broker: broker1
          instance: broker1
          cluster: local-kraft

      - targets: ['broker2:9404']           # ← Use 9404, not 9402
        labels:
          broker: broker2
          instance: broker2
          cluster: local-kraft

      - targets: ['broker3:9404']           # ← Use 9404, not 9403
        labels:
          broker: broker3
          instance: broker3
          cluster: local-kraft

  # Optional: keep if you still have envoy / lb
  - job_name: 'envoy'
    metrics_path: '/stats'
    params:
      format: ['prometheus']
    scrape_interval: 5s
    static_configs:
      - targets: ['lb:9901']